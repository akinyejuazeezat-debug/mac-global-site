<!DOCTYPE html>
<html lang="en-NG">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — MAC Global Travels Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { navy: { DEFAULT: '#0A2A43', deep: '#071B2C' }, gold: { DEFAULT: '#C9972F', light: '#E7C468' } },
      fontFamily: { display: ['"Playfair Display"', 'serif'], sans: ['Manrope', 'sans-serif'] },
    } } }
  </script>
</head>
<body class="admin-shell font-sans text-ink">
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>mgtRequireAuth();</script>
  <script src="../assets/js/admin.js"></script>

  <div class="flex">

    <aside id="admin-sidebar" class="hidden lg:flex lg:flex-col w-64 shrink-0 bg-navy-deep text-white/85 min-h-screen p-5">
      <a href="../index.html" class="flex items-center gap-3 mb-8 px-1">
        <span class="flex h-10 w-10 items-center justify-center rounded-sm bg-gold text-navy-deep font-display font-extrabold text-lg">M</span>
        <span class="font-display text-white text-base leading-tight">MAC GLOBAL<br><span class="text-xs tracking-widest text-gold">ADMIN PANEL</span></span>
      </a>
      <nav class="flex flex-col gap-1.5">
      <a href="dashboard.html" class="sidebar-link"><span>🏠</span><span>Dashboard</span></a>
      <a href="packages.html" class="sidebar-link"><span>🧳</span><span>Tour Packages</span></a>
      <a href="blog.html" class="sidebar-link"><span>📰</span><span>Blog &amp; News</span></a>
      <a href="messages.html" class="sidebar-link active"><span>✉️</span><span>Messages</span></a>
      <a href="settings.html" class="sidebar-link"><span>⚙️</span><span>Settings</span></a>
      </nav>
      <div class="mt-auto pt-6 border-t border-white/10 flex flex-col gap-1.5">
        <a href="../index.html" target="_blank" class="sidebar-link"><span>🌐</span><span>View Website</span></a>
        <button onclick="mgtAdminLogout()" class="sidebar-link text-left w-full"><span>🚪</span><span>Log Out</span></button>
      </div>
    </aside>
    <div class="flex-1 min-w-0">
      <header class="bg-white border-b border-[var(--line)] sticky top-0 z-30">
        <div class="flex items-center justify-between px-5 sm:px-8 h-16">
          <div class="flex items-center gap-3">
            <button id="admin-nav-toggle" class="lg:hidden p-2 -ml-2" aria-label="Toggle menu">
              <svg class="w-6 h-6 text-navy" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <h1 class="font-display text-xl text-navy">Messages</h1>
          </div>
          <div class="flex items-center gap-3 text-sm">
            <span class="hidden sm:inline text-[var(--ink-soft)]">Signed in as</span>
            <span class="font-bold text-navy" id="admin-email-badge">Admin</span>
          </div>
        </div>
      </header>

      <main class="p-5 sm:p-8">

        <p class="text-[var(--ink-soft)] mb-6">Contact and booking requests submitted through your website's contact form.</p>
        <div id="admin-messages-list"></div>

        <!-- Reply Modal -->
        <div id="reply-modal" class="hidden fixed inset-0 bg-navy-deep/60 z-50 items-center justify-center p-4">
          <div class="bg-white rounded-sm max-w-lg w-full p-7 sm:p-8 relative">
            <button id="reply-modal-close" type="button" class="absolute top-5 right-5 text-2xl text-[var(--ink-soft)] hover:text-navy leading-none">&times;</button>
            <h2 class="font-display text-xl text-navy mb-6">Reply to Enquiry</h2>
            <form id="reply-form" class="space-y-5">
              <div>
                <label class="block text-sm font-bold text-navy mb-1.5">Your Reply</label>
                <textarea name="reply" rows="5" required class="w-full border border-[var(--line)] rounded-sm px-4 py-2.5 text-sm outline-none focus:border-navy" placeholder="Type your reply — this is saved to the enquiry record. Use 'Reply on WhatsApp' to actually send it to the client."></textarea>
              </div>
              <button type="submit" class="btn btn-navy">Save Reply</button>
            </form>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script>
    const _sess = mgtAdminSession();
    if(_sess){ document.getElementById('admin-email-badge').textContent = _sess.email; }
    const _toggle = document.getElementById('admin-nav-toggle');
    const _sidebar = document.getElementById('admin-sidebar');
    if(_toggle && _sidebar){
      _toggle.addEventListener('click', () => {
        _sidebar.classList.toggle('hidden');
        _sidebar.classList.toggle('flex');
        _sidebar.classList.add('fixed', 'z-40', 'inset-y-0', 'left-0');
      });
    }
  </script>
</body>
</html>
