backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
    - name: "pages"
    label: "Pages"
    files:
            - label: "Home Page"
        name: "home"
        file: "content/home.md"
        fields:
                    - {label: "Title", name: "title", widget: "string"}
                    - {label: "Body", name: "body", widget: "markdown"}
            - label: "About Page"
        name: "about"
        file: "content/about.md"
        fields:
                    - {label: "Title", name: "title", widget: "string"}
                    - {label: "Body", name: "body", widget: "markdown"}
